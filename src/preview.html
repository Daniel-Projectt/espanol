<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Español artwork</title>
<style>
:root{--bg:#f5f1e8;--surface:#fffdf7;--ink:#1d1b17;--muted:#8c8475;--gold:#b4506e;--gold-soft:#c6a469;
  --serif:"Palatino Linotype","Book Antiqua",Palatino,Cambria,"Times New Roman",serif;
  --sans:Optima,Candara,"Segoe UI",-apple-system,"Helvetica Neue",Arial,sans-serif}
html,body{margin:0;height:100%}
body{font-family:var(--serif);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden}
.page{position:relative;width:1200px;height:630px;background:var(--bg);background-image:radial-gradient(760px 420px at 50% 30%,#fffdf7 0%,rgba(255,253,247,0) 72%)}
.frame{position:absolute;inset:30px;border:2px solid rgba(180,80,110,.40)}
.frame::before{content:"";position:absolute;inset:10px;border:1px solid rgba(154,122,68,.28)}
.frame .dm{position:absolute;width:12px;height:12px;background:var(--gold);transform:rotate(45deg)}
.frame .dm.tl{left:-7px;top:-7px}.frame .dm.tr{right:-7px;top:-7px}.frame .dm.bl{left:-7px;bottom:-7px}.frame .dm.br{right:-7px;bottom:-7px}
.inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 80px}
.emblem{width:92px;height:92px;color:var(--gold-soft);margin-bottom:18px}
.eyebrow{font-family:var(--sans);font-size:16px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);margin:0 0 14px}
h1{font-weight:400;font-size:66px;line-height:1.08;margin:0;letter-spacing:.005em}
.orn{color:var(--gold-soft);width:340px;height:auto;margin:22px auto 0;display:block}
.sub{margin:18px 0 0;color:var(--muted);font-style:italic;font-size:21px}
.sub2{margin:6px 0 0;color:var(--muted);font-size:16px;font-family:var(--sans);letter-spacing:.14em;text-transform:uppercase}
body.icon .page{width:512px;height:512px;background-image:radial-gradient(360px 300px at 50% 36%,#fffdf7 0%,rgba(255,253,247,0) 72%)}
body.icon .frame{inset:24px}
body.icon .emblem{width:280px;height:280px;margin:0 0 10px}
.emblem.heart{display:none}
body.icon .emblem{display:none}
body.icon .emblem.heart{display:block;width:300px;height:300px;margin:0 0 4px}
body.icon .eyebrow,body.icon h1,body.icon .orn,body.icon .sub,body.icon .sub2{display:none}
.short{display:none}
body.icon .short{display:block;font-family:var(--sans);font-size:26px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);margin:0 0 0 .34em}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="flourish" viewBox="0 0 320 44">
    <g id="flh" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
      <path d="M160 22 C132 22 110 6 80 14 C60 19 48 30 30 24"/>
      <path d="M30 24 c-7-3-14 2-12 8 c2 5 9 5 10 0 c0.6-3-2-5-4.5-4"/>
      <path d="M158 30 C130 34 114 24 88 28 C74 30 66 37 54 36" stroke-width=".8" opacity=".75"/>
      <path d="M54 36 c-5-1-9 3-7 7 c2 3 6 2 6-1" stroke-width=".8" opacity=".75"/>
      <path d="M104 15 c3-10 12-15 22-13 c-4 7-12 12-22 13z" fill="currentColor" stroke="none" opacity=".9"/>
      <path d="M130 19 c3 8 11 13 20 11 c-3-6-10-11-20-11z" fill="currentColor" stroke="none" opacity=".75"/>
      <path d="M70 18 c2-7 9-10 15-8 c-3 5-8 8-15 8z" fill="currentColor" stroke="none" opacity=".7"/>
    </g>
    <use href="#flh" transform="matrix(-1 0 0 1 320 0)"/>
    <path d="M160 16 l6 6-6 6-6-6z" fill="currentColor"/>
  </symbol>
  <!-- the home-screen icon: a heart with a rose inside (made for someone special) -->
  <symbol id="heartrose" viewBox="0 0 120 120">

    <path d="M60 110 C19 83 1 59 8 36 C15 14 43 7 60 28 C77 7 105 14 112 36 C119 59 101 83 60 110 Z" fill="none" stroke="#c6a469" stroke-width=".8" opacity=".8"/>
    <path d="M60 97 C29 76 16 57 21 40 C26 26 45 22 60 40 C75 22 94 26 99 40 C104 57 91 76 60 97 Z" fill="none" stroke="#e8bccb" stroke-width="1"/>
    <g fill="none" stroke="#c6a469" stroke-width="1.2" stroke-linecap="round">
      <path d="M60 71 C60 78 59 84 60 90"/>
      <path d="M60 81 C54 76 47 76 43 79 C48 84 55 84 60 81 Z" fill="#c6a469" fill-opacity=".85"/>
      <path d="M60 85 C66 80 73 80 77 83 C72 88 65 88 60 85 Z" fill="#c6a469" fill-opacity=".85"/>
    </g>
    <g stroke="#b4506e" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round">
      <path d="M60 44 C71 44 77 51 76 59 C75 67 68 72 60 72 C52 72 45 67 44 59 C43 51 49 44 60 44 Z" fill="#f4d3dd"/>
      <path d="M47 60 C50 67 55 70 60 70 C65 70 70 67 73 60" fill="none"/>
      <path d="M50 50 C53 47 57 46 61 47" fill="none"/>
      <path d="M60 51 C66 50 69 55 67 59 C65 63 58 64 55 60 C53 57 55 54 58 54 C60 54 61 56 60 57" fill="none"/>
      <path d="M52 55 C51 61 54 65 59 66" fill="none"/>
      <path d="M69 52 C71 56 71 60 68 64" fill="none"/>
    </g>
  </symbol>
  <!-- masthead seal: a sun, the old Spanish and Latin-American emblem, engraved like the others -->
  <symbol id="emblem" viewBox="0 0 120 120">
    <circle cx="60" cy="60" r="59" fill="none" stroke="currentColor" stroke-width=".5" opacity=".35"/>
    <circle cx="60" cy="60" r="56.5" fill="none" stroke="currentColor" stroke-width=".9" opacity=".55"/>
    <g stroke="currentColor" stroke-width="1.1" stroke-linecap="round" opacity=".8"><path d="M60 9 L60 21" transform="rotate(0 60 60)"/><path d="M60 14 L60 21" transform="rotate(15 60 60)"/><path d="M60 9 L60 21" transform="rotate(30 60 60)"/><path d="M60 14 L60 21" transform="rotate(45 60 60)"/><path d="M60 9 L60 21" transform="rotate(60 60 60)"/><path d="M60 14 L60 21" transform="rotate(75 60 60)"/><path d="M60 9 L60 21" transform="rotate(90 60 60)"/><path d="M60 14 L60 21" transform="rotate(105 60 60)"/><path d="M60 9 L60 21" transform="rotate(120 60 60)"/><path d="M60 14 L60 21" transform="rotate(135 60 60)"/><path d="M60 9 L60 21" transform="rotate(150 60 60)"/><path d="M60 14 L60 21" transform="rotate(165 60 60)"/><path d="M60 9 L60 21" transform="rotate(180 60 60)"/><path d="M60 14 L60 21" transform="rotate(195 60 60)"/><path d="M60 9 L60 21" transform="rotate(210 60 60)"/><path d="M60 14 L60 21" transform="rotate(225 60 60)"/><path d="M60 9 L60 21" transform="rotate(240 60 60)"/><path d="M60 14 L60 21" transform="rotate(255 60 60)"/><path d="M60 9 L60 21" transform="rotate(270 60 60)"/><path d="M60 14 L60 21" transform="rotate(285 60 60)"/><path d="M60 9 L60 21" transform="rotate(300 60 60)"/><path d="M60 14 L60 21" transform="rotate(315 60 60)"/><path d="M60 9 L60 21" transform="rotate(330 60 60)"/><path d="M60 14 L60 21" transform="rotate(345 60 60)"/></g>
    <circle cx="60" cy="60" r="36" fill="none" stroke="currentColor" stroke-width="1.4"/>
    <circle cx="60" cy="60" r="31.5" fill="none" stroke="currentColor" stroke-width=".7" opacity=".6"/>
    <text x="60" y="71" text-anchor="middle" font-family="Palatino Linotype,Book Antiqua,Palatino,serif" font-size="34" fill="currentColor">ñ</text>
    <g stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity=".6"><path d="M60 1v7M60 112v7M1 60h7M112 60h7"/></g>
  </symbol>
</svg>
<div class="page">
  <div class="frame"><span class="dm tl"></span><span class="dm tr"></span><span class="dm bl"></span><span class="dm br"></span></div>
  <div class="inner">
    <svg class="emblem" viewBox="0 0 120 120"><use href="#emblem"/></svg>
    <svg class="emblem heart" viewBox="0 0 120 120"><use href="#heartrose"/></svg>
    <p class="short">ESPAÑOL</p>
    <p class="eyebrow">Hablar &middot; to speak</p>
    <h1>Español</h1>
    <svg class="orn" viewBox="0 0 320 44"><use href="#flourish"/></svg>
    <p class="sub">A little every day, out loud: new words, review, speaking drills and conversations</p>
    <p class="sub2">words &middot; speaking &middot; irregular verbs &middot; connecting words &middot; grammar</p>
  </div>
</div>
<script>if(/icon/.test(location.search)) document.body.className = "icon";</script>
</body>
</html>
